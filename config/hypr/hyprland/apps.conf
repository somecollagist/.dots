$terminal   = foot
$browser    = firefox
$editor     = code
$music      = spotify

bind = $mod, Return,    exec, $terminal
bind = $mod, W,         exec, $browser
bind = $mod, C,         exec, $editor
bind = $mod, S,         exec, $music

bind = $mod, slash,     exec, gnome-control-center
bind = $mod, D,         exec, wofi --show=drun